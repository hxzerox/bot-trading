name: research
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Buscar estrategias (simulación, sin claves ni dinero)
        run: python research.py auto 60
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "lab"
          git config user.email "lab@users.noreply.github.com"
          git add auto_results.jsonl auto_stats.json forward.json champion.json STATUS.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "laboratorio" && git pull --rebase && git push)
